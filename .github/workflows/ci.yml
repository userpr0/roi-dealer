name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Integration tests create a throwaway database per test file (CI-only credentials).
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: roi_dealer_ci
          POSTGRES_USER: roi_dealer
          POSTGRES_PASSWORD: roi_dealer_ci_only
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roi_dealer -d roi_dealer_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://roi_dealer:roi_dealer_ci_only@localhost:5432/roi_dealer_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

      - name: Apply database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Integration tests
        run: pnpm test:integration

      - name: Validate Docker Compose config
        run: |
          docker compose -f infra/docker/compose.yaml config --quiet
          printf 'POSTGRES_PASSWORD=ci\nPUBLIC_HOST=ci.example\nENV_DIR=%s\n' "$RUNNER_TEMP/env" > "$RUNNER_TEMP/compose.env"
          mkdir -p "$RUNNER_TEMP/env" && touch "$RUNNER_TEMP"/env/{database,bot,worker,api}.env
          docker compose -f infra/hetzner/compose.yaml --env-file "$RUNNER_TEMP/compose.env" config --quiet

      - name: Check server scripts
        run: shellcheck infra/hetzner/*.sh

  bot-image:
    name: Build bot Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -f apps/bot/Dockerfile --build-arg APP_VERSION=${{ github.sha }} -t roi-dealer-bot:ci .

  worker-image:
    name: Build worker Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -f apps/worker/Dockerfile --build-arg APP_VERSION=${{ github.sha }} -t roi-dealer-worker:ci .

  api-image:
    name: Build api Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -f apps/api/Dockerfile --build-arg APP_VERSION=${{ github.sha }} -t roi-dealer-api:ci .

  # ADR-0010: after green checks on main, publish the images the Hetzner server pulls.
  publish:
    name: Publish ${{ matrix.service }} image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, bot-image, worker-image, api-image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [bot, worker, api]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          version="${GITHUB_SHA::7}"
          image="ghcr.io/userpr0/roi-dealer-$SERVICE"
          docker build -f "apps/$SERVICE/Dockerfile" \
            --build-arg APP_VERSION="$version" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$image:main" -t "$image:$version" .
          docker push "$image:$version"
          docker push "$image:main"
