name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Integration tests create a throwaway database per test file (CI-only credentials).
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: roi_dealer_ci
          POSTGRES_USER: roi_dealer
          POSTGRES_PASSWORD: roi_dealer_ci_only
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roi_dealer -d roi_dealer_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://roi_dealer:roi_dealer_ci_only@localhost:5432/roi_dealer_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

      - name: Apply database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Integration tests
        run: pnpm test:integration

      - name: Validate Docker Compose config
        run: docker compose -f infra/docker/compose.yaml config --quiet

  bot-image:
    name: Build bot Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -f apps/bot/Dockerfile --build-arg APP_VERSION=${{ github.sha }} -t roi-dealer-bot:ci .
